# BlackBook Glasses — Canadian Black Book values on Meta Ray-Ban Display
# Render deployment (free tier). No build step: stdlib-only Python.

services:
  - type: web
    name: blackbook-glasses
    env: python
    plan: free
    buildCommand: "echo 'no build needed (stdlib only)'"
    startCommand: "python3 server.py"
    envVars:
      - key: BLACKBOOK_HOST
        value: 0.0.0.0
      # Set these in the Render dashboard (never commit secrets):
      # BLACKBOOK_KEY              — access key required as ?k= on / and /api/value
      # BLACKBOOK_TEST_MODE        — 1 = serve verified test VIN only, 0 = live Cherry
      # CHERRY_USERNAME            — Cherry dealer login username
      # CHERRY_PASSWORD            — Cherry dealer login password
      # CHERRY_PROVINCE            — province code, default ON
